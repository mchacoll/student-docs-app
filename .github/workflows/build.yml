name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Patch PDF saving for Android
        run: |
          python3 - <<'EOF'
          p='www/index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace("else doc.save('students-docs.pdf')","else await window.__saveNative(doc)")
          inj="""<script>
          window.__saveNative=async function(doc){
            const P=window.Capacitor&&window.Capacitor.Plugins;
            if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&P&&P.Filesystem&&P.Share){
              const b64=doc.output('datauristring').split(',')[1];
              const r=await P.Filesystem.writeFile({path:'students-docs.pdf',data:b64,directory:'CACHE'});
              await P.Share.share({title:'students-docs.pdf',url:r.uri});
            }else{doc.save('students-docs.pdf')}
          };
          </script>"""
          s=s.replace('</body>',inj+'</body>')
          open(p,'w',encoding='utf-8').write(s)
          EOF
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init "صور الطلاب" com.students.docs --web-dir=www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: student-docs-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
